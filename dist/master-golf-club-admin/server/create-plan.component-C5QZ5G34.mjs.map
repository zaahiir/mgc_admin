<c-row ngPreserveWhitespaces>
  <c-col xs="12">
    <c-card class="mb-4">
      <c-card-header>
        <strong>New Subscription Plan</strong>
      </c-card-header>
      <c-card-body>
        <form [formGroup]="planForm" (ngSubmit)="onSubmit()" cForm class="row g-3 needs-validation">
          <!-- Plan Name -->
          <c-col [cFormFloating]="true" md="6">
            <input cFormControl id="planName" formControlName="planName" required type="text" placeholder="Plan Name" />
            <label cLabel for="planName" class="ms-2">Plan Name</label>
            <c-form-feedback [valid]="false" *ngIf="f['planName'].errors && (f['planName'].touched || submitted)">
              Please provide a plan name
            </c-form-feedback>
          </c-col>

          <!-- Plan Description -->
          <c-col [cFormFloating]="true" md="6">
            <input cFormControl id="planDescription" formControlName="planDescription" required type="text" placeholder="Plan Description" />
            <label cLabel for="planDescription" class="ms-2">Plan Description</label>
            <c-form-feedback [valid]="false" *ngIf="f['planDescription'].errors && (f['planDescription'].touched || submitted)">
              Please provide a description
            </c-form-feedback>
          </c-col>

          <!-- Plan Duration -->
          <c-col [cFormFloating]="true" md="6">
            <input cFormControl id="planDuration" formControlName="planDuration" required type="number" min="1" step="1" placeholder="Duration in years (e.g., 1, 2, 5)" />
            <label cLabel for="planDuration" class="ms-2">Plan Duration (Years)</label>
            <c-form-feedback [valid]="false" *ngIf="f['planDuration'].errors && (f['planDuration'].touched || submitted)">
              Please provide a valid duration in years
            </c-form-feedback>
          </c-col>

          <!-- Plan Price -->
          <c-col [cFormFloating]="true" md="6">
            <input cFormControl id="planPrice" formControlName="planPrice" required type="number" step="0.01" placeholder="Plan Price" />
            <label cLabel for="planPrice" class="ms-2">Plan Price</label>
            <c-form-feedback [valid]="false" *ngIf="f['planPrice'].errors && (f['planPrice'].touched || submitted)">
              Please provide a valid price
            </c-form-feedback>
          </c-col>

          <!-- Plan Features Section -->
          <c-col xs="12">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h5>Plan Features</h5>
              <button type="button" cButton color="success" size="sm" (click)="addFeature()">
                <i class="cil-plus"></i> Add Feature
              </button>
            </div>
            
            <div formArrayName="features" class="mb-5">
              <div *ngFor="let feature of featuresArray.controls; let i = index" [formGroupName]="i" class="row g-3 mb-4 p-3 border rounded">
                <c-col md="6">
                  <input cFormControl formControlName="featureName" type="text" placeholder="Feature Name" />
                  <c-form-feedback [valid]="false" *ngIf="feature.get('featureName')?.errors && (feature.get('featureName')?.touched || submitted)">
                    Feature name is required
                  </c-form-feedback>
                </c-col>
                <c-col md="4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" formControlName="isIncluded" id="included{{i}}">
                    <label class="form-check-label" for="included{{i}}">
                      Included in plan
                    </label>
                  </div>
                </c-col>
                <c-col md="2">
                  <button type="button" cButton color="danger" size="sm" (click)="removeFeature(i)">
                    <i class="cil-trash"></i> Remove
                  </button>
                </c-col>
              </div>
            </div>
          </c-col>

          <!-- Form Actions -->
          <c-col xs="12">
            <button cButton class="me-1" color="primary" type="submit" [disabled]="loading">
              {{ loading ? 'Saving...' : 'Save Plan' }}
            </button>
            <button (click)="onReset()" cButton color="secondary" type="button" [disabled]="loading">
              Reset Form
            </button>
          </c-col>
        </form>
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
