<div class="row">
  <div class="col-12">
    <div class="card mb-4">
      <div class="card-header">
        <strong>New Subscription Plan</strong>
      </div>
      <div class="card-body">
        <form [formGroup]="planForm" (ngSubmit)="onSubmit()" class="row g-3 needs-validation">
          <!-- Plan Name -->
          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="planName" formControlName="planName" required type="text" placeholder="Plan Name" />
              <label for="planName" class="ms-2">Plan Name</label>
            </div>
            <div class="invalid-feedback" *ngIf="f['planName'].errors && (f['planName'].touched || submitted)">
              Please provide a plan name
            </div>
          </div>

          <!-- Plan Description -->
          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="planDescription" formControlName="planDescription" required type="text" placeholder="Plan Description" />
              <label for="planDescription" class="ms-2">Plan Description</label>
            </div>
            <div class="invalid-feedback" *ngIf="f['planDescription'].errors && (f['planDescription'].touched || submitted)">
              Please provide a description
            </div>
          </div>

          <!-- Plan Duration -->
          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="planDuration" formControlName="planDuration" required type="number" min="1" step="1" placeholder="Duration in years (e.g., 1, 2, 5)" />
              <label for="planDuration" class="ms-2">Plan Duration (Years)</label>
            </div>
            <div class="invalid-feedback" *ngIf="f['planDuration'].errors && (f['planDuration'].touched || submitted)">
              Please provide a valid duration in years
            </div>
          </div>

          <!-- Plan Price -->
          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="planPrice" formControlName="planPrice" required type="number" step="0.01" placeholder="Plan Price" />
              <label for="planPrice" class="ms-2">Plan Price</label>
            </div>
            <div class="invalid-feedback" *ngIf="f['planPrice'].errors && (f['planPrice'].touched || submitted)">
              Please provide a valid price
            </div>
          </div>

          <!-- Plan Features Section -->
          <div class="col-12">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h5>Plan Features</h5>
              <button type="button" class="btn btn-success btn-sm" (click)="addFeature()">
                <i class="bi bi-plus"></i> Add Feature
              </button>
            </div>

            <div formArrayName="features" class="mb-5">
              <div *ngFor="let feature of featuresArray.controls; let i = index" [formGroupName]="i" class="row g-3 mb-4 p-3 border rounded">
                <div class="col-md-6">
                  <input class="form-control" formControlName="featureName" type="text" placeholder="Feature Name" />
                  <div class="invalid-feedback" *ngIf="feature.get('featureName')?.errors && (feature.get('featureName')?.touched || submitted)">
                    Feature name is required
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" formControlName="isIncluded" id="included{{i}}">
                    <label class="form-check-label" for="included{{i}}">
                      Included in plan
                    </label>
                  </div>
                </div>
                <div class="col-md-2">
                  <button type="button" class="btn btn-danger btn-sm" (click)="removeFeature(i)">
                    <i class="bi bi-trash"></i> Remove
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Form Actions -->
          <div class="col-12">
            <button type="submit" class="me-1 btn btn-primary" [disabled]="loading">
              {{ loading ? 'Saving...' : 'Save Plan' }}
            </button>
            <button (click)="onReset()" type="button" class="btn btn-secondary" [disabled]="loading">
              Reset Form
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
