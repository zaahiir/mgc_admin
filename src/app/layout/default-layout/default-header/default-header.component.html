<header class="mb-4 d-print-none header header-sticky p-0 shadow-sm">
  <div class="d-flex align-items-center border-bottom px-4 py-2">
    <button
      class="btn btn-link p-0 me-3"
      (click)="toggleSidebar()"
      aria-label="Toggle sidebar navigation"
    >
      <i class="bi bi-list fs-4"></i>
    </button>

    <div class="ms-auto">
      <div class="dropdown position-relative">
        <button
          type="button"
          class="btn p-0 border-0"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="userMenuOpen"
          aria-label="Open user menu"
        >
          <img
            src="./assets/images/avatars/8.jpg"
            class="rounded-1"
            width="32"
            height="32"
            alt="User avatar"
          />
        </button>
        <ul class="dropdown-menu dropdown-menu-end" [class.show]="userMenuOpen">
          <li>
            <a class="dropdown-item" routerLink="/profile" (click)="closeUserMenu()">
              <i class="bi bi-person me-2"></i>Profile
            </a>
          </li>
          <li>
            <a class="dropdown-item" routerLink="/settings" (click)="closeUserMenu()">
              <i class="bi bi-gear me-2"></i>Settings
            </a>
          </li>
          <li><hr class="dropdown-divider" /></li>
          <li>
            <a class="dropdown-item" (click)="onLogout()" style="cursor: pointer;" data-logout-btn>
              <i class="bi bi-box-arrow-right me-2"></i>Logout
            </a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <!-- click-away backdrop to close the user menu -->
  <div
    *ngIf="userMenuOpen"
    class="dropdown-backdrop"
    (click)="closeUserMenu()"
  ></div>
</header>
