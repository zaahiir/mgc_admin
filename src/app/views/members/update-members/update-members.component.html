<div class="row">
  <div class="col-12">
    <div class="card mb-4">
      <div class="card-header">
        <strong>Update Member Profile</strong>
      </div>
      <div class="card-body">
        <form [formGroup]="memberForm"
          (ngSubmit)="onSubmit()"
          class="row g-3 needs-validation"
        >
          <!-- Basic Information -->
          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="firstName" formControlName="firstName" required type="text" placeholder="First Name" />
              <label for="firstName" class="ms-2">First Name</label>
            </div>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('firstName')">
              {{ getErrorMessage('firstName') }}
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="lastName" formControlName="lastName" required type="text" placeholder="Last Name" />
              <label for="lastName" class="ms-2">Last Name</label>
            </div>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('lastName')">
              {{ getErrorMessage('lastName') }}
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="email" formControlName="email" required type="email" placeholder="Email" />
              <label for="email" class="ms-2">Email</label>
            </div>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('email')">
              {{ getErrorMessage('email') }}
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="phoneNumber" formControlName="phoneNumber" required type="tel" placeholder="Phone Number" />
              <label for="phoneNumber" class="ms-2">Phone Number</label>
            </div>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('phoneNumber')">
              {{ getErrorMessage('phoneNumber') }}
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="alternatePhoneNumber" formControlName="alternatePhoneNumber" type="tel" placeholder="Alternate Phone Number" />
              <label for="alternatePhoneNumber" class="ms-2">Alternate Phone Number</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="alternateEmail" formControlName="alternateEmail" type="email" placeholder="Alternate Email" />
              <label for="alternateEmail" class="ms-2">Alternate Email</label>
            </div>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('alternateEmail')">
              {{ getErrorMessage('alternateEmail') }}
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="dateOfBirth" formControlName="dateOfBirth" type="date" placeholder="Date of Birth" />
              <label for="dateOfBirth" class="ms-2">Date of Birth</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <select class="form-select" id="gender" formControlName="gender">
                <option value="">Select Gender</option>
                <option *ngFor="let gender of genders" [value]="gender.id">
                  {{ gender.genderName }}
                </option>
              </select>
              <label for="gender" class="ms-2">Gender</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <select class="form-select" id="nationality" formControlName="nationality">
                <option value="">Select Nationality</option>
                <option *ngFor="let nationality of nationalities" [value]="nationality.id">
                  {{ nationality.countryName }}
                </option>
              </select>
              <label for="nationality" class="ms-2">Nationality</label>
            </div>
          </div>

          <div class="col-md-12">
            <div class="form-floating">
              <textarea class="form-control" id="address" formControlName="address" placeholder="Address" rows="3"></textarea>
              <label for="address" class="ms-2">Address</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <select class="form-select" id="plan" formControlName="plan" required>
                <option value="">Select Plan</option>
                <option *ngFor="let plan of plans" [value]="plan.id">
                  {{ plan.planName }}
                </option>
              </select>
              <label for="plan" class="ms-2">Membership Plan</label>
            </div>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('plan')">
              {{ getErrorMessage('plan') }}
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="golfClubId" formControlName="golfClubId" readonly type="text" placeholder="Golf Club ID" />
              <label for="golfClubId" class="ms-2">Golf Club ID</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="membershipStartDate" formControlName="membershipStartDate" type="date"
                     placeholder="Membership Start Date" />
              <label for="membershipStartDate" class="ms-2">Membership Start Date</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="membershipEndDate" formControlName="membershipEndDate" type="date"
                     placeholder="Membership End Date" [disabled]="true" />
              <label for="membershipEndDate" class="ms-2">Membership End Date</label>
            </div>
          </div>

          <!-- Emergency Contact -->
          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="emergencyContactName" formControlName="emergencyContactName" type="text"
                     placeholder="Emergency Contact Name" />
              <label for="emergencyContactName" class="ms-2">Emergency Contact Name</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="emergencyContactPhone" formControlName="emergencyContactPhone" type="tel"
                     placeholder="Emergency Contact Phone" />
              <label for="emergencyContactPhone" class="ms-2">Emergency Contact Phone</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="emergencyContactRelation" formControlName="emergencyContactRelation" type="text"
                     placeholder="Relationship" />
              <label for="emergencyContactRelation" class="ms-2">Relationship</label>
            </div>
          </div>

          <div class="col-md-6">
            <div class="form-floating">
              <input class="form-control" id="referredBy" formControlName="referredBy" type="text"
                     placeholder="Referred By" />
              <label for="referredBy" class="ms-2">Referred By (Optional)</label>
            </div>
          </div>

          <!-- File Uploads -->
          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label" for="profilePhoto">Profile Photo</label>
              <input class="form-control" type="file" id="profilePhoto"
                     accept="image/*" (change)="onFileSelected($event, 'profile')" />
              <div *ngIf="profilePhotoPreview" class="mt-2">
                <img [src]="profilePhotoPreview" alt="Profile Preview"
                     style="max-width: 200px; max-height: 200px;" class="img-thumbnail" />
                <button type="button" class="ms-2 btn btn-danger btn-sm"
                        (click)="removeFile('profile')">
                  Remove Photo
                </button>
              </div>
            </div>
          </div>

          <div class="col-md-6">
            <div class="mb-3">
              <label class="form-label" for="idProof">ID Proof</label>
              <input class="form-control" type="file" id="idProof"
                     accept=".pdf,.jpg,.jpeg,.png" (change)="onFileSelected($event, 'idProof')" />
              <div *ngIf="idProofPreview" class="mt-2">
                <ng-container *ngIf="idProofPreview.toString().includes('data:image')">
                  <img [src]="idProofPreview" alt="ID Proof Preview"
                       style="max-width: 200px; max-height: 200px;" class="img-thumbnail" />
                </ng-container>
                <ng-container *ngIf="!idProofPreview.toString().includes('data:image')">
                  <div class="alert alert-info">
                    ID Proof document uploaded
                  </div>
                </ng-container>
                <button type="button" class="ms-2 btn btn-danger btn-sm"
                        (click)="removeFile('idProof')">
                  Remove ID Proof
                </button>
              </div>
            </div>
          </div>

          <!-- Additional Information -->
          <div class="col-md-6">
            <div class="form-check mt-3">
              <input class="form-check-input" type="checkbox" id="handicap"
                     formControlName="handicap" />
              <label class="form-check-label" for="handicap">
                Handicap
              </label>
            </div>
          </div>

          <!-- Form Actions -->
          <div class="col-12 mt-4">
            <button type="submit" class="me-2 btn btn-primary" [disabled]="loading">
              {{ loading ? 'Saving...' : 'Update Member Profile' }}
            </button>
            <button type="button" class="btn btn-secondary" [disabled]="loading"
                    (click)="onCancel()">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
