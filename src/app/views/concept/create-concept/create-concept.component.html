<!-- create-concept.component.html -->
<div class="row">
  <div class="col-12">
    <div class="card mb-4">
      <div class="card-header">
        <div class="d-flex justify-content-between align-items-center">
          <strong>{{ isEditMode ? 'Edit Concept' : 'Create Concept' }}</strong>
          <div *ngIf="hasExistingData" class="d-flex gap-2">
            <button
              type="button"
              class="btn btn-outline-danger btn-sm"
              (click)="onDelete()"
              [disabled]="loading">
              <i class="fas fa-trash me-1"></i>
              Delete Concept
            </button>
          </div>
        </div>
      </div>
      <div class="card-body">
        <form [formGroup]="conceptForm" (ngSubmit)="onSubmit()" #form="ngForm" class="row g-3 needs-validation">

          <!-- Loading Indicator -->
          <div *ngIf="loading && !submitted" class="text-center py-3">
            <div class="spinner-border text-primary" role="status">
              <span class="visually-hidden">Loading...</span>
            </div>
            <p class="mt-2 text-muted">Loading concept data...</p>
          </div>

          <!-- Concept Highlight -->
          <div class="col-md-12" *ngIf="!loading || submitted">
            <div class="form-floating">
              <textarea
                class="form-control"
                id="conceptHighlight"
                formControlName="conceptHighlight"
                placeholder="Concept Highlight"
                rows="3"
                autoResize
                [disabled]="loading">
              </textarea>
              <label for="conceptHighlight" class="ms-2">Concept Highlight</label>
            </div>
            <div class="invalid-feedback" *ngIf="isFieldInvalid('conceptHighlight')">
              {{ getErrorMessage('conceptHighlight') }}
            </div>
          </div>

          <!-- Dynamic Concept Items -->
          <div class="col-12" *ngIf="!loading || submitted">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <h5>Concept Items ({{ conceptItems.length }}/7)</h5>
              <button
                type="button"
                class="btn btn-success btn-sm"
                (click)="addConceptItem()"
                [disabled]="conceptItems.length >= 7 || loading">
                <i class="fas fa-plus me-1"></i>
                Add Item
              </button>
            </div>

            <div formArrayName="items">
              <div
                *ngFor="let item of conceptItems.controls; let i = index"
                [formGroupName]="i"
                class="concept-item-card mb-4 p-3 border rounded">

                <div class="d-flex justify-content-between align-items-center mb-3">
                  <h6 class="mb-0">Concept Item {{ i + 1 }}</h6>
                  <button
                    type="button"
                    class="btn btn-outline-danger btn-sm"
                    (click)="removeConceptItem(i)"
                    [disabled]="conceptItems.length <= 1 || loading">
                    <i class="fas fa-trash"></i>
                  </button>
                </div>

                <div class="row">
                  <div class="col-md-4">
                    <div class="form-floating">
                      <input
                        class="form-control"
                        [id]="'heading_' + i"
                        formControlName="heading"
                        type="text"
                        placeholder="Heading"
                        [disabled]="loading" />
                      <label [for]="'heading_' + i" class="ms-2">Heading</label>
                    </div>
                    <div class="invalid-feedback" *ngIf="isItemFieldInvalid(i, 'heading')">
                      This field is required
                    </div>
                  </div>

                  <div class="col-md-8">
                    <div class="form-floating">
                      <textarea
                        class="form-control"
                        [id]="'paragraph_' + i"
                        formControlName="paragraph"
                        placeholder="Paragraph"
                        rows="4"
                        autoResize
                        [disabled]="loading">
                      </textarea>
                      <label [for]="'paragraph_' + i" class="ms-2">Paragraph</label>
                    </div>
                    <div class="invalid-feedback" *ngIf="isItemFieldInvalid(i, 'paragraph')">
                      This field is required
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <!-- Form Actions -->
          <div class="col-12" *ngIf="!loading || submitted">
            <div class="d-flex gap-2">
              <button class="btn btn-primary" type="submit" [disabled]="loading">
                <span *ngIf="loading && submitted" class="spinner-border spinner-border-sm me-2"></span>
                {{ loading && submitted ? 'Saving...' : (isEditMode ? 'Update Concept' : 'Save Concept') }}
              </button>

              <button
                *ngIf="isEditMode"
                type="button"
                class="btn btn-outline-secondary"
                (click)="loadConceptData()"
                [disabled]="loading">
                <i class="fas fa-sync me-1"></i>
                Refresh
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
