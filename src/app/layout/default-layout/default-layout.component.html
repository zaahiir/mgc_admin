<div class="layout-shell">
  <!--sidebar-->
  <nav
    id="sidebar1"
    class="sidebar d-print-none"
    [class.show]="sidebarVisible"
    [class.narrow]="sidebarNarrow"
  >
    <button
      type="button"
      class="sidebar-close d-md-none"
      (click)="closeSidebar()"
      aria-label="Close sidebar"
      title="Close sidebar"
    >
      <i class="bi bi-x-lg"></i>
    </button>

    <!--header: fixed, never shrinks-->
    <div class="sidebar-header">
      <a routerLink="/" class="sidebar-brand-link">
        <img src="../../../assets/mgc_logo-03.png" class="sidebar-brand-logo" alt="logo">
      </a>
    </div>

    <!--menu: the ONLY scrollable region-->
    <div class="sidebar-menu-scroll">
      <ul class="nav nav-pills sidebar-nav sidebar-menu-grid">
        @for (item of navItems; track item.url) {
          <li class="nav-item">
            <a
              class="nav-link d-flex align-items-center gap-2"
              routerLink="{{ item.url }}"
              routerLinkActive="active"
              [routerLinkActiveOptions]="{ exact: false }"
              (click)="onNavClick()"
              [attr.title]="item.name"
            >
              <i class="bi" [ngClass]="item.icon ? 'bi-' + item.icon : 'bi-circle'"></i>
              <span class="nav-text">{{ item.name }}</span>
            </a>
          </li>
        }
      </ul>
    </div>

    <!--footer: fixed, never shrinks-->
    <div class="sidebar-footer">
      <button
        class="btn btn-sm btn-light w-100 sidebar-toggle-btn"
        (click)="toggleSidebar()"
        aria-label="Toggle sidebar"
        title="Toggle sidebar"
      >
        <i class="bi" [ngClass]="sidebarNarrow ? 'bi-chevron-double-right' : 'bi-chevron-double-left'"></i>
        <span class="nav-text">Collapse</span>
      </button>
    </div>
  </nav>

  <!--backdrop (mobile off-canvas)-->
  <div class="sidebar-backdrop" *ngIf="sidebarVisible" (click)="closeSidebar()"></div>

  <!--main-->
  <div class="wrapper" [class.narrow]="sidebarNarrow">
    <app-default-header (sidebarToggle)="toggleSidebar()" />
    <div class="body flex-grow-1">
      <div class="container-fluid px-4 py-3">
        <router-outlet />
      </div>
    </div>
    <app-default-footer />
  </div>
</div>
